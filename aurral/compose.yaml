# Aurral - AI/taste music discovery, scheduled playlist "Flows", and automated
# downloader companion for Navidrome.
#
# Docs: https://docs.aurral.org/
#
# Storage layout (all on the NVMe SSD /home for zero spin-up latency):
#   - App DB, settings, jobs & yt-dlp staging: /home/aurral/config -> /config
#   - Shared music root (matches Navidrome):   /home/navidrome/music -> /data
#   - Optional Usenet/torrent completed area:  /mnt/media/Downloads -> /downloads
#
# Because both Aurral and Navidrome mount /home/navidrome/music at /data,
# Aurral's default Library folder (/data/downloads/aurral) resolves to the exact
# same path inside Navidrome without any remote path mappings.
#
# Networks: Aurral joins `navidrome_default` (reach Navidrome at
# http://navidrome:4533) and `downloads_default` (reach SABnzbd / Prowlarr /
# Gluetun+qBittorrent if configured).
#
# Ports are bound to the LAN address + loopback only. Off-LAN access is via
# `tailscale serve`; `docker-published-firewall.service` drops non-LAN traffic.
name: aurral

services:
  aurral:
    image: ghcr.io/lklynet/aurral:${AURRAL_VERSION}
    container_name: aurral
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      # LAN + loopback (loopback is used by `tailscale serve`)
      - "192.168.1.70:3001:3001"
      - "127.0.0.1:3001:3001"
    volumes:
      - /home/aurral/config:/config
      - /home/navidrome/music:/data
      - /mnt/media/Downloads:/downloads
    networks:
      - default
      - navidrome_net
      - downloads_net

networks:
  # The Navidrome stack's default network (http://navidrome:4533).
  navidrome_net:
    external: true
    name: navidrome_default
  # The downloads stack's default network (SABnzbd / Prowlarr / qBittorrent).
  downloads_net:
    external: true
    name: downloads_default
