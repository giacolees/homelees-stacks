# Authelia — login portal for *.homelees.party (https://auth.homelees.party).
# Secrets are injected via *_FILE env vars from /home/sso/authelia/secrets.
theme: auto
server:
  address: 'tcp://:9091/'
log:
  level: info
totp:
  issuer: homelees.party
webauthn:
  disable: false
  enable_passkey_login: true
  # A passkey with user verification (Touch ID / Face ID / PIN) counts as two
  # factors on its own, so one tap satisfies the two_factor policy below.
  experimental_enable_passkey_uv_two_factors: true
  display_name: homelees
  timeout: 60s
  selection_criteria:
    discoverability: preferred
    user_verification: required
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users.yml
    watch: true
access_control:
  default_policy: deny
  rules:
    # API endpoints authenticate with the app's own API key (mobile apps, *arr <-> *arr)
    - domain: ['sonarr.homelees.party', 'radarr.homelees.party', 'prowlarr.homelees.party', 'bazarr.homelees.party', 'sab.homelees.party']
      resources: ['^/api([/?].*)?$', '^/feed([/?].*)?$', '^/[0-9]+/api([/?].*)?$', '^/[0-9]+/download([/?].*)?$']
      policy: bypass
    - domain: torrent.homelees.party
      resources: ['^/api/v2/.*$']
      policy: bypass
    # Navidrome: Subsonic API (apps, own token auth), public share links, health
    - domain: music.homelees.party
      resources: ['^/rest/.*$', '^/share/.*$', '^/ping$']
      policy: bypass
    # Calibre-Web-Automated: OPDS catalog + KOReader sync for e-readers (CWA basic auth)
    - domain: books.homelees.party
      resources: ['^/opds([/?].*)?$', '^/kosync([/?].*)?$']
      policy: bypass
    - domain: '*.homelees.party'
      policy: two_factor
session:
  cookies:
    - domain: homelees.party
      authelia_url: https://auth.homelees.party
      default_redirection_url: https://home.homelees.party
      expiration: 12h
      inactivity: 4h
      remember_me: 1M
regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 15m
storage:
  local:
    path: /data/db.sqlite3
notifier:
  # No mail server: one-time codes (e.g. to register a passkey) are written here:
  # sudo cat /home/sso/authelia/data/notification.txt
  filesystem:
    filename: /data/notification.txt
identity_providers:
  oidc:
    # Secrets are read from /secrets via the template filter (X_AUTHELIA_CONFIG_FILTERS=template).
    hmac_secret: {{ secret "/secrets/oidc_hmac_secret" | mindent 0 "|" | msquote }}
    jwks:
      - key_id: homelees-rs256
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc_jwks_rsa.pem" | mindent 10 "|" | msquote }}
    claims_policies:
      # Put the user claims into the ID token too (many apps only read the ID token).
      homelees:
        id_token: ['preferred_username', 'name', 'email', 'email_verified', 'groups']
    clients:
      - client_id: nextcloud
        client_name: Nextcloud
        client_secret: {{ secret "/secrets/oidc_nextcloud_digest" | msquote }}
        public: false
        authorization_policy: two_factor
        claims_policy: homelees
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris: ['https://cloud.homelees.party/apps/user_oidc/code']
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
      - client_id: komodo
        client_name: Komodo
        client_secret: {{ secret "/secrets/oidc_komodo_digest" | msquote }}
        public: false
        authorization_policy: two_factor
        claims_policy: homelees
        redirect_uris: ['https://komodo.homelees.party/auth/oidc/callback']
        scopes: ['openid', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
      - client_id: beszel
        client_name: Beszel
        client_secret: {{ secret "/secrets/oidc_beszel_digest" | msquote }}
        public: false
        authorization_policy: two_factor
        claims_policy: homelees
        redirect_uris: ['https://beszel.homelees.party/api/oauth2-redirect']
        scopes: ['openid', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
