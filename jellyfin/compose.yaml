# Jellyfin media server (linuxserver.io image)
#
# Adopted from the previously CasaOS-managed container that was running as an
# orphan. The image, volumes and environment are preserved so existing Jellyfin
# settings and library configuration keep working. Data lives outside git in
# /DATA/AppData/jellyfin.
#
# Primary interface:  sudo docker compose -f /opt/stacks/jellyfin/compose.yaml ...
# Secrets:            ./.env  (gitignored, e.g. OPENAI_API_KEY)
#
# Ports are bound to the LAN address and loopback only. Remote (off-LAN) access
# is provided by `tailscale serve` -> tcp/8096 -> 127.0.0.1:8096. DLNA stays
# LAN-only. Do NOT change these to 0.0.0.0 without also reviewing the firewall.
services:
  jellyfin:
    # Version-pinned tag (image id 51252e7a416e). Avoid :latest.
    image: linuxserver/jellyfin:12.1ubu2604-ls50
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - JELLYFIN_PublishedServerUrl=
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - /DATA/AppData/jellyfin/config:/config
      # Transcode/cache scratch kept OFF the small (23G) root SSD: put it on the
      # big /home disk so a runaway transcode cache can never fill / and take
      # down the server again. Paired with jellyfin-transcode-cleanup.timer.
      - /home/jellyfin/transcodes:/config/cache/transcodes
      # 18TB media disk, stably mounted at /mnt/media via /etc/fstab (UUID)
      - /mnt/media:/media
    ports:
      # Web UI (LAN + loopback for tailscale serve)
      - "${LAN_IP:?run host/site-env.sh}:8096:8096"
      - "127.0.0.1:8096:8096"
      # DLNA discovery (LAN only)
      - "${LAN_IP:?run host/site-env.sh}:1900:1900/udp"
      - "${LAN_IP:?run host/site-env.sh}:7359:7359/udp"
    networks:
      - default
      # Shared network so the requests stack (Seerr) can reach Jellyfin
      # by container name (http://jellyfin:8096) without host-port firewalling.
      - media_net

networks:
  media_net:
    external: true
