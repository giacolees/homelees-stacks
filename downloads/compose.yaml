# Media acquisition stack
#
#   Seerr (click to request; runs in its own `requests` stack)
#        -> Prowlarr (indexers)
#        -> Sonarr / Radarr (search + import)
#        -> qBittorrent (torrents, behind Gluetun VPN) and SABnzbd (Usenet)
#   Bazarr (subtitles)
#
# All config lives in ./config (gitignored). Media and downloads live on the
# 18TB disk mounted at /mnt/media, exposed to every app as /data so that
# Sonarr/Radarr can HARDLINK imports (same filesystem) instead of copying.
#
# VPN: qBittorrent shares Gluetun's network namespace. Fill in ./.env before
# starting, then: sudo docker compose -f /opt/stacks/downloads/compose.yaml up -d
#
# Ports are bound to the LAN address + loopback only; remote access is via
# `tailscale serve`. See /opt/stacks/README.md.
name: downloads

x-arr: &arr
  restart: unless-stopped
  environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Rome

services:
  # --- VPN gateway (kill switch for qBittorrent) ---
  gluetun:
    image: qmcgaw/gluetun@sha256:596fb46a686fd060b33022669dba951496bc8fa8c68a6306fd8a4acf689497c3 # = :latest of 2026-09-23 (commit 79b4b74)
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # qBittorrent Web UI is published here because qBittorrent shares
      # Gluetun's network namespace.
      - "192.168.1.70:8080:8080"
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=Europe/Rome
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      # WireGuard (ProtonVPN: only the private key is needed)
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # OpenVPN (only needed if VPN_TYPE=openvpn)
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      # Optional server selection
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FREE_ONLY=${FREE_ONLY:-off}
      # Allow the Web UI through the firewall; enable ProtonVPN NAT-PMP port forwarding
      - FIREWALL_INPUT_PORTS=8080
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/gluetun/update-qbittorrent-port.sh "{{PORTS}}"'
      - QBITTORRENT_USER=${QBITTORRENT_USER}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
    volumes:
      - ./config/gluetun:/gluetun

  # --- Torrent client (traffic only leaves via Gluetun) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls477
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/media:/data

  # --- Usenet client (TLS to provider, runs on the normal network) ---
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls273
    container_name: sabnzbd
    <<: *arr
    ports:
      - "192.168.1.70:8081:8080"
      - "127.0.0.1:8081:8080"
    volumes:
      - ./config/sabnzbd:/config
      - /mnt/media:/data

  # --- Indexer manager ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162
    container_name: prowlarr
    <<: *arr
    ports:
      - "192.168.1.70:9696:9696"
      - "127.0.0.1:9696:9696"
    volumes:
      - ./config/prowlarr:/config

  # --- Cloudflare / DDoS-GUARD bypass proxy for Prowlarr ---
  # Internal only (no published port): Prowlarr reaches it at
  # http://flaresolverr:8191 — add it there under Settings -> Indexers ->
  # Add Indexer -> FlareSolverr. Never expose this service to the Internet.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    # The router's DNS (192.168.1.254) blackholes annas-archive.gl to 127.0.0.1
    # (ISP-level piracy block). FlareSolverr is what fetches Anna's Archive for
    # Shelfarr, so give it a public resolver to bypass the DNS-level block;
    # IP-level access to the real host works. Container-name DNS still uses
    # Docker's embedded resolver (127.0.0.11), which forwards here.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    environment:
      - TZ=Europe/Rome
      - LOG_LEVEL=info
      - LOG_FILE=none
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    # Headless Chrome needs more than Docker's default 64MB /dev/shm.
    shm_size: 256mb

  # --- TV automation ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
    container_name: sonarr
    <<: *arr
    ports:
      - "192.168.1.70:8989:8989"
      - "127.0.0.1:8989:8989"
    volumes:
      - ./config/sonarr:/config
      - /mnt/media:/data

  # --- Movie automation ---
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
    container_name: radarr
    <<: *arr
    ports:
      - "192.168.1.70:7878:7878"
      - "127.0.0.1:7878:7878"
    volumes:
      - ./config/radarr:/config
      - /mnt/media:/data

  # --- Subtitles ---
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.1-ls365
    container_name: bazarr
    <<: *arr
    ports:
      - "192.168.1.70:6767:6767"
      - "127.0.0.1:6767:6767"
    volumes:
      - ./config/bazarr:/config
      - /mnt/media:/data

