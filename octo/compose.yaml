# Octo - Subsonic/OpenSubsonic discovery, streaming, radio & auto-download proxy
# sitting in front of Navidrome (http://navidrome:4533).
#
# Upstream: https://github.com/winters27/octo
#
# Point Subsonic clients (Sonora on macOS, Amperfy / Narjo on iOS, Symfonium, etc.)
# at Octo on port 5274 instead of directly at Navidrome (4533).
#
# Storage layout (all on the NVMe SSD /home for zero spin-up latency):
#   - Octo settings, state & cover cache: /home/octo/config -> /app/config
#   - yt-dlp player/nsig cache:           /home/octo/ytdlp-cache -> /root/.cache/yt-dlp
#   - yt-dlp-shim SQLite duration cache:  /home/octo/ytshim-cache -> /var/lib/ytshim
#   - yt-dlp self-updating binary dir:    /home/octo/ytdlp-bin -> /opt/ytdlp
#   - Shared music root (matches Navidrome ND_MUSICFOLDER=/data):
#       /home/navidrome/music -> /data
#
# Ports are bound to the LAN address + loopback only. Off-LAN access is via
# `tailscale serve`; `docker-published-firewall.service` drops non-LAN traffic.
name: octo

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-3}"

services:
  octo:
    image: ghcr.io/winters27/octo:${OCTO_IMAGE_TAG}
    container_name: octo
    restart: unless-stopped
    logging: *logging
    ports:
      # LAN + loopback (loopback is used by `tailscale serve`)
      - "192.168.1.70:5274:8080"
      - "127.0.0.1:5274:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-Europe/Rome}

      # ----- Subsonic / Navidrome upstream -----
      Subsonic__Url: ${SUBSONIC_URL:-http://navidrome:4533}
      Subsonic__AdminUsername: ${SUBSONIC_ADMIN_USERNAME:-}
      Subsonic__AdminPassword: ${SUBSONIC_ADMIN_PASSWORD:-}
      Subsonic__AutoDetectDownloadPath: ${AUTO_DETECT_DOWNLOAD_PATH:-true}
      Subsonic__StorageMode: ${STORAGE_MODE:-Stream}
      Subsonic__DownloadMode: ${DOWNLOAD_MODE:-Track}
      Subsonic__DownloadOnStar: ${DOWNLOAD_ON_STAR:-true}
      Subsonic__DownloadAlbumOnStar: ${DOWNLOAD_ALBUM_ON_STAR:-true}
      Subsonic__DownloadAlbumOnSongStar: ${DOWNLOAD_ALBUM_ON_SONG_STAR:-false}
      Subsonic__RecordRequestedBy: ${RECORD_REQUESTED_BY:-true}
      Subsonic__StarDownloadsForRequester: ${STAR_DOWNLOADS_FOR_REQUESTER:-true}
      Subsonic__SkipOwnedSongs: ${SKIP_OWNED_SONGS:-true}
      Subsonic__WaitForLosslessOnPlay: ${WAIT_FOR_LOSSLESS_ON_PLAY:-false}
      Subsonic__LosslessWaitTimeoutSeconds: ${LOSSLESS_WAIT_TIMEOUT_SECONDS:-0}
      Subsonic__DownloadOnPlay: ${DOWNLOAD_ON_PLAY:-true}
      Subsonic__LidarrAlbumOnPlay: ${LIDARR_ALBUM_ON_PLAY:-false}
      Subsonic__FolderStructure: ${FOLDER_STRUCTURE:-Organized}
      Subsonic__DownloadSource: ${DOWNLOAD_SOURCE:-YouTube}
      Subsonic__UseLocalStaging: ${USE_LOCAL_STAGING:-false}
      Subsonic__ExplicitFilter: ${EXPLICIT_FILTER:-All}
      Subsonic__CacheDurationHours: ${CACHE_DURATION_HOURS:-1}
      Subsonic__EnableExternalPlaylists: ${ENABLE_EXTERNAL_PLAYLISTS:-false}
      Subsonic__EnableSearchDiscovery: ${ENABLE_SEARCH_DISCOVERY:-true}
      Subsonic__WaitForSearchDurations: ${WAIT_FOR_SEARCH_DURATIONS:-true}
      Subsonic__SearchDurationWaitMs: ${SEARCH_DURATION_WAIT_MS:-1000}
      Subsonic__SearchLastFmWaitMs: ${SEARCH_LASTFM_WAIT_MS:-1000}
      Subsonic__StreamSizeWarmPerMinute: ${STREAM_SIZE_WARM_PER_MINUTE:-5}
      Subsonic__CoverCacheMb: ${COVER_CACHE_MB:-1024}
      Subsonic__CoverBadge: ${COVER_BADGE:-true}
      Subsonic__SizeFlagClients: ${SIZE_FLAG_CLIENTS:-Amperfy}
      Subsonic__EnableSyncCatalog: ${ENABLE_SYNC_CATALOG:-true}
      Subsonic__SyncCatalogClients: ${SYNC_CATALOG_CLIENTS:-Symfonium}
      Subsonic__SyncCatalogMaxSongs: ${SYNC_CATALOG_MAX_SONGS:-1000}

      # Shared music library path (matches ND_MUSICFOLDER=/data in Navidrome)
      Library__DownloadPath: /data

      # ----- yt-dlp shim sidecar (stream-preview & YouTube download source) -----
      YouTube__ShimUrl: http://yt-dlp-shim:8080

      # ----- Multi-source Radio & Last.fm -----
      LastFm__ApiKey: ${LASTFM_API_KEY:-}
      LastFm__ApiSecret: ${LASTFM_API_SECRET:-}
      LastFm__EnableRadio: ${LASTFM_ENABLE_RADIO:-true}
      LastFm__RadioTrackCount: ${LASTFM_RADIO_TRACK_COUNT:-50}
      LastFm__RadioCacheDurationHours: ${LASTFM_RADIO_CACHE_HOURS:-24}
      LastFm__EnablePersonalizedStations: ${LASTFM_ENABLE_PERSONALIZED_STATIONS:-true}
      LastFm__EnableYourMix: ${LASTFM_ENABLE_YOUR_MIX:-true}
      LastFm__EnableDiscoveryMix: ${LASTFM_ENABLE_DISCOVERY_MIX:-true}
      LastFm__ArtistStationCount: ${LASTFM_ARTIST_STATION_COUNT:-2}
      LastFm__GenreStationCount: ${LASTFM_GENRE_STATION_COUNT:-3}
      LastFm__EnableDiscoveryStations: ${LASTFM_ENABLE_DISCOVERY_STATIONS:-true}
      LastFm__ExposeRadioAsPlaylists: ${LASTFM_EXPOSE_AS_PLAYLISTS:-true}
      LastFm__ExposeRadioAsStreams: ${LASTFM_EXPOSE_AS_STREAMS:-true}
      LastFm__RadioStreamBitrateKbps: ${LASTFM_RADIO_STREAM_BITRATE_KBPS:-192}
      LastFm__HistoryRetentionDays: ${LASTFM_HISTORY_RETENTION_DAYS:-90}
      LastFm__DiscoveryPercent: ${LASTFM_DISCOVERY_PERCENT:-35}
      LastFm__RefreshIntervalHours: ${LASTFM_REFRESH_INTERVAL_HOURS:-12}
      LastFm__MinimumPlays: ${LASTFM_MINIMUM_PLAYS:-10}
      RadioSources__YouTubeMusic: ${RADIO_YOUTUBE_MUSIC:-true}
      RadioSources__ListenBrainz: ${RADIO_LISTENBRAINZ:-true}
      RadioSources__ListenBrainzAlgorithm: ${RADIO_LISTENBRAINZ_ALGORITHM:-session_based_days_9000_session_300_contribution_5_threshold_15_limit_50_skip_30}
      RadioSources__ListenBrainzRadioMode: ${RADIO_LISTENBRAINZ_RADIO_MODE:-easy}
      RadioSources__SoundsAlike: ${RADIO_SOUNDS_ALIKE:-true}
      RadioSources__SonicUrl: ${RADIO_SONIC_URL:-http://octo-sonic:8080}
      RadioSources__SonicPauseSeconds: ${RADIO_SONIC_PAUSE_SECONDS:-2}
      RadioSources__LearnFromListening: ${RADIO_LEARN_FROM_LISTENING:-true}

      # ----- Generated Playlists, Charts & Mixes -----
      GeneratedPlaylists__PopularNow: ${POPULAR_NOW:-true}
      GeneratedPlaylists__Charts: ${CHARTS:-new,trending,18,14,6}
      GeneratedPlaylists__ChartCountry: ${CHART_COUNTRY:-auto}
      GeneratedPlaylists__Enabled: ${MIXES_ENABLED:-true}
      GeneratedPlaylists__Genres: ${MIXES_GENRES:-true}
      GeneratedPlaylists__Decades: ${MIXES_DECADES:-true}
      GeneratedPlaylists__TrackCount: ${MIX_TRACK_COUNT:-100}
      GeneratedPlaylists__MaxPerArtist: ${MIX_MAX_PER_ARTIST:-3}
      GeneratedPlaylists__CreateAt: ${MIX_CREATE_AT:-20}
      GeneratedPlaylists__RemoveBelow: ${MIX_REMOVE_BELOW:-10}
      GeneratedPlaylists__MaxPlaylists: ${MIX_MAX_PLAYLISTS:-20}
      GeneratedPlaylists__RefreshHours: ${MIX_REFRESH_HOURS:-24}
      GeneratedPlaylists__NewReleases: ${FOR_YOU_NEW_RELEASES:-true}
      GeneratedPlaylists__Rediscover: ${FOR_YOU_REDISCOVER:-true}
      GeneratedPlaylists__DeepCuts: ${FOR_YOU_DEEP_CUTS:-true}
      GeneratedPlaylists__NewReleaseWeeks: ${NEW_RELEASE_WEEKS:-8}
      GeneratedPlaylists__NewReleaseArtists: ${NEW_RELEASE_ARTISTS:-50}
      GeneratedPlaylists__RediscoverMonths: ${REDISCOVER_MONTHS:-6}
      GeneratedPlaylists__LikedSongs: ${LIKED_SONGS:-true}
      GeneratedPlaylists__LikedSongsName: ${LIKED_SONGS_NAME:-Liked Songs}
      GeneratedPlaylists__LikedSongsMax: ${LIKED_SONGS_MAX:-500}

      # ----- Metadata, Cover Art, ReplayGain & Synced Lyrics -----
      Metadata__Language: ${METADATA_LANGUAGE:-en}
      Metadata__AlbumFromTitle: ${ALBUM_FROM_TITLE:-true}
      Metadata__UseCoverArtArchive: ${COVER_ART_ARCHIVE:-true}
      Metadata__ReplaceVideoCovers: ${REPLACE_VIDEO_COVERS:-true}
      Metadata__WriteCoverFile: ${COVER_FILE:-true}
      Metadata__EmbedFullSizeCovers: ${FULL_SIZE_COVERS:-false}
      Metadata__PreferOriginalAlbum: ${PREFER_ORIGINAL_ALBUM:-true}
      Metadata__YearFromOriginalRelease: ${YEAR_FROM_ORIGINAL_RELEASE:-true}
      Metadata__ReleaseDetailsLookup: ${RELEASE_DETAILS_LOOKUP:-true}
      Metadata__ReplayGain: ${REPLAYGAIN:-true}
      Metadata__ReplayGainTimeoutSeconds: ${REPLAYGAIN_TIMEOUT_SECONDS:-45}
      Metadata__AnimatedArt: ${ANIMATED_ART:-direct}
      Metadata__FetchLyrics: ${LYRICS_FETCH:-true}
      Metadata__LyricsSources: ${LYRICS_SOURCES:-song,kugou,lrclib,lyricsovh}
      Metadata__PreferWordTimedLyrics: ${LYRICS_PREFER_WORD_TIMED:-true}
      Metadata__WriteLyricsBesideAllSongs: ${LYRICS_WRITE_BESIDE_ALL:-false}
      Metadata__SaveLyricsTo: ${LYRICS_SAVE_TO:-beside}

      # ----- Updates, Dashboard & Logging -----
      Updates__Check: ${UPDATES_CHECK:-true}
      Updates__Repo: ${UPDATES_REPO:-winters27/octo}
      Admin__SignIn: ${ADMIN_SIGN_IN:-required}
      Admin__Port: ${ADMIN_PORT:-0}
      Family__Enabled: ${FAMILY_ENABLED:-false}
      Logging__LogLevel__Microsoft.AspNetCore: ${LOG_LEVEL_ASPNETCORE:-Warning}
      Logging__LogLevel__System.Net.Http.HttpClient: ${LOG_LEVEL_HTTPCLIENT:-Warning}
    volumes:
      - /home/navidrome/music:/data
      - /home/octo/config:/app/config
    depends_on:
      - yt-dlp-shim
    networks:
      - default
      - navidrome_net

  yt-dlp-shim:
    image: ghcr.io/winters27/octo-yt-dlp-shim:${OCTO_IMAGE_TAG}
    container_name: yt-dlp-shim
    restart: unless-stopped
    logging: *logging
    environment:
      SHIM_THREADS: ${SHIM_THREADS:-128}
      MAX_CONCURRENT_YTDLP: ${YTDLP_MAX_CONCURRENT:-5}
      GATE_RESERVE_INTERACTIVE: ${YTDLP_GATE_RESERVE:-2}
      BG_GATE_WAIT_SEC: ${YTDLP_BG_GATE_WAIT_SEC:-10}
      SEARCH_CACHE_MAX: ${YTDLP_SEARCH_CACHE_MAX:-1024}
      URL_CACHE_MAX: ${YTDLP_URL_CACHE_MAX:-512}
      URL_CACHE_TTL: ${YTDLP_URL_CACHE_TTL:-3600}
      YTDLP_PLAYER_CLIENT: ${YTDLP_PLAYER_CLIENT:-visionos}
      DOWNLOAD_ROOT: /data
      YTDLP_PATH: /opt/ytdlp/yt-dlp
      META_DB_PATH: /var/lib/ytshim/meta.db
    expose:
      - "8080"
    volumes:
      - /home/octo/ytdlp-cache:/root/.cache/yt-dlp
      - /home/octo/ytshim-cache:/var/lib/ytshim
      - /home/navidrome/music:/data
      - /home/octo/ytdlp-bin:/opt/ytdlp

  octo-sonic:
    image: ghcr.io/winters27/octo-sonic:${OCTO_IMAGE_TAG}
    container_name: octo-sonic
    restart: unless-stopped
    logging: *logging
    init: true
    expose:
      - "8080"
    environment:
      MUSIC_ROOT: /data
      ANALYSE_CONCURRENCY: "1"
      SONIC_ENABLED: ${RADIO_SOUNDS_ALIKE:-true}
    cpus: ${SONIC_CPUS:-1}
    mem_limit: 2g
    user: ${SONIC_USER:-1000:1000}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/navidrome/music:/data:ro

networks:
  # The Navidrome stack's default network (http://navidrome:4533).
  navidrome_net:
    external: true
    name: navidrome_default
