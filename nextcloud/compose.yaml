# Nextcloud - personal cloud / file sync.
#
# Data lives on the 18TB disk (/mnt/media/Nextcloud/data); config, database and
# Redis live on the SSD (/home/nextcloud). Secrets are in ./.env (gitignored).
# LAN + loopback only; remote access via NetBird -> https://cloud.<domain>.
name: nextcloud

services:
  db:
    image: mariadb:11.8.9
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - /home/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  redis:
    image: redis:7.4.11-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    volumes:
      - /home/nextcloud/redis:/data

  app:
    # Built from ./Dockerfile (extends nextcloud:stable-apache with the
    # ffmpeg/exiftool binaries that Memories needs). Update the base with:
    #   docker compose build --pull && docker compose up -d
    build:
      context: .
      dockerfile: Dockerfile
    image: homelees/nextcloud:apache-memories
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "${LAN_IP:?run host/site-env.sh}:8082:80"
      - "127.0.0.1:8082:80"
    volumes:
      - /home/nextcloud/config:/var/www/html
      - /mnt/media/Nextcloud/data:/var/www/html/data
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      # Hostnames accepted by Nextcloud (ports are not part of this check)
      - NEXTCLOUD_TRUSTED_DOMAINS=${LAN_IP} ${NB_HOST} ${NB_IP} cloud.${DOMAIN} localhost 127.0.0.1
      # Trust Docker / Caddy (loopback) forwarded traffic
      - TRUSTED_PROXIES=172.16.0.0/12 127.0.0.1
