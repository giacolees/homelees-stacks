#!/usr/sbin/nft -f
# homelees host firewall — INPUT (traffic to the host itself) only.
#
# NEVER add `flush ruleset` here: Docker (DOCKER-USER / published ports) and
# NetBird keep their own tables, and flushing them breaks every container.
# This file only (re)creates `table inet homelees`. Docker-published ports are
# filtered separately by docker-published-firewall.service (DOCKER-USER).

table inet homelees
delete table inet homelees

table inet homelees {
    set lan4 {
        type ipv4_addr; flags interval
        elements = { 192.168.1.0/24 }
    }

    chain input {
        type filter hook input priority filter + 10; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # VPN overlay: everything on the tunnel is already authenticated
        iifname "wt0" accept     # NetBird

        # Containers reaching host services (e.g. Beszel hub -> agent :45876)
        iifname "docker0" accept
        iifname "br-*" accept

        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        # NetBird direct (peer-to-peer) WireGuard
        udp dport 51820 accept
        # DHCPv6 client replies
        ip6 saddr fe80::/10 udp dport 546 accept

        # LAN-only host services: SSH, Apache landing page, Cockpit
        ip saddr @lan4 tcp dport { 22, 80, 443, 9090 } accept

        limit rate 10/minute log prefix "homelees-drop: " level info
    }
}
