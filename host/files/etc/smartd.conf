# homelees smartd config (2026-11-22). Alerts -> /usr/local/sbin/smartd-notify -> Telegram.
# NVMe system disk: full attribute monitoring, temperature warn 60 / crit 70 °C,
# short self-test Sundays 03:00, long self-test 1st of month 04:00.
/dev/nvme0 -d nvme -a -W 0,60,70 -s (S/../../7/03|L/../01/./04) -m root -M exec /usr/local/sbin/smartd-notify
# 18 TB USB HDD: the enclosure's bridge does not pass ATA SMART through
# (sat/usb* modes all fail); only the SCSI health flag is available.
# Supplemented by homelees-healthcheck (kernel I/O errors, ext4 errors, mount).
/dev/sda -d removable -d scsi -H -l error -m root -M exec /usr/local/sbin/smartd-notify
