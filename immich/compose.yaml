# Immich - self-hosted photo & video library.
#
# Based on the official compose file for Immich v3.2.2:
#   https://github.com/immich-app/immich/blob/v3.2.2/docker/docker-compose.yml
#
# Storage layout:
#   - Library (upload, library, thumbs, encoded-video): /mnt/media/Immich (18TB disk)
#   - PostgreSQL + ML model cache: named volumes on the SSD
#     (Docker data-root is /home/docker, so these land under /home/docker/volumes)
#
# Ports are bound to the LAN address and loopback only. Off-LAN access is via
# `tailscale serve` -> tcp/2283 -> 127.0.0.1:2283, and
# `docker-published-firewall.service` drops non-LAN traffic to 2283 in
# DOCKER-USER. Do NOT publish on 0.0.0.0 without reviewing the firewall.
#
# Transcoding uses the AMD Radeon Vega iGPU via VAAPI (/dev/dri). ML inference
# runs on CPU (Immich does not accelerate ML on AMD integrated GPUs).
name: immich

services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # LAN + loopback (loopback is used by `tailscale serve`)
      - "192.168.1.70:2283:2283"
      - "127.0.0.1:2283:2283"
    devices:
      # AMD Radeon Vega iGPU for VAAPI hardware transcoding
      - /dev/dri:/dev/dri
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false

  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      interval: 30s
      timeout: 5s
      retries: 5

  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Database is on the SSD, so leave the HDD storage tweak disabled.
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

volumes:
  pgdata:
  model-cache:
