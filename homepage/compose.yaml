# Homepage dashboard + Glances (host/server status).
# Config is YAML under ./config (tracked in git; no secrets).
name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    # Start Glances first so the server-status widget has data on first load.
    depends_on:
      - glances
    environment:
      - TZ=Europe/Rome
      # Change this to 192.168.1.70 if you prefer LAN-IP links (works only at
      # home). The MagicDNS name works from anywhere over Tailscale.
      - HOMEPAGE_VAR_HOST=homelees-1.lungfish-pike.ts.net
      # Hosts allowed to load the dashboard (Next.js host check).
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.70:3000,homelees-1.lungfish-pike.ts.net:3000,100.87.187.75:3000,localhost:3000,127.0.0.1:3000
    volumes:
      - ./config:/app/config
    ports:
      # LAN + loopback only; remote access via `tailscale serve` -> tcp/3000
      - "192.168.1.70:3000:3000"
      - "127.0.0.1:3000:3000"

  # Host metrics for the Homepage "glances" server-status widget.
  # pid: host lets it see host processes; the host root and media disk are
  # mounted read-only so it reports the real filesystems. No published port:
  # only Homepage reaches it, over the internal Docker network.
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    environment:
      - TZ=Europe/Rome
      - GLANCES_OPT=-w
    volumes:
      - /etc/os-release:/etc/os-release:ro
      - /:/host:ro
      - /mnt/media:/mnt/media:ro
