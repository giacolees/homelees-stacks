# Links use {{HOMEPAGE_VAR_HOST}}; widget API keys come from .env (gitignored).
# Widget URLs use container names because Homepage joins the app Docker networks.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://{{HOMEPAGE_VAR_HOST}}:8096
        description: Movies, TV, music, books
        # Enable after the Jellyfin setup wizard + creating an API key
        # (Settings -> Advanced -> API Keys):
        # widget:
        #   type: jellyfin
        #   url: http://jellyfin:8096
        #   key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
    - Jellyseerr:
        icon: jellyseerr.png
        href: http://{{HOMEPAGE_VAR_HOST}}:5055
        description: Request movies & shows
        # Enable after Jellyseerr setup (Settings -> General -> API Key):
        # widget:
        #   type: seerr
        #   url: http://jellyseerr:5055
        #   key: {{HOMEPAGE_VAR_JELLYSEERR_KEY}}
    - Bazarr:
        icon: bazarr.png
        href: http://{{HOMEPAGE_VAR_HOST}}:6767
        description: Subtitles
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: {{HOMEPAGE_VAR_BAZARR_KEY}}

