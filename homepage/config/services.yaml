# All links use {{HOMEPAGE_VAR_HOST}}, set in compose.yaml.
# Server status is provided by the Glances info widget (widgets.yaml).

- Files:
    - Nextcloud:
        icon: nextcloud.png
        href: http://{{HOMEPAGE_VAR_HOST}}:8082
        description: Files, photos, calendar

- Photos:
    - Immich:
        icon: immich.png
        href: http://{{HOMEPAGE_VAR_HOST}}:2283
        description: Photo & video backup (mobile app)

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://{{HOMEPAGE_VAR_HOST}}:8096
        description: Movies, TV, music, books
    - Jellyseerr:
        icon: jellyseerr.png
        href: http://{{HOMEPAGE_VAR_HOST}}:5055
        description: Request movies & shows
    - Bazarr:
        icon: bazarr.png
        href: http://{{HOMEPAGE_VAR_HOST}}:6767
        description: Subtitles

- Downloads:
    - Sonarr:
        icon: sonarr.png
        href: http://{{HOMEPAGE_VAR_HOST}}:8989
        description: TV automation
    - Radarr:
        icon: radarr.png
        href: http://{{HOMEPAGE_VAR_HOST}}:7878
        description: Movie automation
    - Prowlarr:
        icon: prowlarr.png
        href: http://{{HOMEPAGE_VAR_HOST}}:9696
        description: Indexers
    - qBittorrent:
        icon: qbittorrent.png
        href: http://{{HOMEPAGE_VAR_HOST}}:8080
        description: Torrents (VPN)
    - SABnzbd:
        icon: sabnzbd.png
        href: http://{{HOMEPAGE_VAR_HOST}}:8081
        description: Usenet

- Management:
    - Cockpit:
        icon: cockpit.png
        href: https://{{HOMEPAGE_VAR_HOST}}:9090
        description: Server management
    - Komodo:
        icon: komodo.png
        href: http://{{HOMEPAGE_VAR_HOST}}:9120
        description: Containers, builds & deploys
        widget:
            type: komodo
            url: http://192.168.1.70:9120
            key: "{{HOMEPAGE_VAR_KOMODO_KEY}}"
            secret: "{{HOMEPAGE_VAR_KOMODO_SECRET}}"
            showSummary: true
    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Tailnet admin

- Health:
    - Vita:
        icon: mdi-heart-pulse
        href: http://{{HOMEPAGE_VAR_HOST}}:3100
        description: Wellness coach
