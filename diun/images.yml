# Watch list for /usr/local/sbin/homelees-image-updates (daily 08:45, Telegram
# message only for NEW versions; results in the 09:00 digest and bot /updates).
# The Diun container is retired (it alerted on every old tag); the format stays
# Diun-compatible. name = the CURRENTLY PINNED image:tag (bump it when you update);
# include_tags = regex of the same release line/scheme.
