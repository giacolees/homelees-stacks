# Beszel - lightweight host + per-container monitoring (hub + agent).
#
# The hub (web UI, SQLite/PocketBase) shows per-container CPU, memory, disk and
# network for this server, with history and alerts. The agent runs on the host
# network so it can read host metrics, and reads Docker stats through the Docker
# socket read-only -> treat it as an admin component and keep the hub LAN-only.
#
# Docs: https://beszel.dev/guide/getting-started
#
# Ports are bound to the LAN address + loopback only. Off-LAN access is via
# `tailscale serve`; `docker-published-firewall.service` drops non-LAN traffic.
name: beszel

services:
  beszel:
    image: henrygd/beszel:${BESZEL_VERSION}
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=https://beszel.${DOMAIN}   # OIDC (Authelia) redirect + links
      # Creates the first admin on first start (only used when no user exists).
      - USER_EMAIL=${BESZEL_ADMIN_EMAIL}
      - USER_PASSWORD=${BESZEL_ADMIN_PASSWORD}
    ports:
      # LAN + loopback (loopback is used by `tailscale serve`)
      - "${LAN_IP:?run host/site-env.sh}:8090:8090"
      - "127.0.0.1:8090:8090"
    volumes:
      - /home/beszel/data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_VERSION}
    container_name: beszel-agent
    restart: unless-stopped
    # Host network: the agent reads host metrics and listens for the hub.
    network_mode: host
    volumes:
      - /home/beszel/agent_data:/var/lib/beszel-agent
      # Read-only, used only for per-container stats. Root-equivalent access.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=45876
      - HUB_URL=http://localhost:8090
      # Set from the hub after the system is added (see docs/services/beszel.md).
      - KEY=${BESZEL_AGENT_KEY}
      - TOKEN=${BESZEL_AGENT_TOKEN}
